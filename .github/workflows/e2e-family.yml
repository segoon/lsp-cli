name: E2E installation family

on:
  workflow_call:
    inputs:
      matrix:
        description: JSON matrix of language groups for one installation family
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out repository and data
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download Mason registry snapshot
        uses: actions/download-artifact@v8
        with:
          name: mason-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mason-registry
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Cache E2E runtimes
        uses: actions/cache@v6
        with:
          path: .env
          key: e2e-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/dependencies/catalog.rs', 'tests/e2e/dependencies/preparation.rs') }}
          restore-keys: e2e-runtimes-${{ runner.os }}-${{ runner.arch }}-
      - name: Increase E2E runtime filesystem capacity
        run: |
          # Server installations, Gradle distributions, and indexes share this tmpfs.
          # Raise its limit without reserving memory or changing sandbox/socket paths.
          findmnt --mountpoint "$XDG_RUNTIME_DIR" --types tmpfs
          sudo mount -o remount,size=50% "$XDG_RUNTIME_DIR"
          df -h "$XDG_RUNTIME_DIR"
      - name: Run compatibility cases
        env:
          MATRIX_CASES: ${{ matrix.cases }}
          E2E_MASON_REGISTRY_SNAPSHOT: ${{ runner.temp }}/mason-registry
        run: |
          IFS=',' read -ra cases <<< "$MATRIX_CASES"
          failed=0
          for case in "${cases[@]}"; do
            if ! make test-e2e CASE="$case"; then
              failed=1
            fi
          done
          exit "$failed"
