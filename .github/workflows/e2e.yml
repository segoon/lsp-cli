name: End-to-end compatibility

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      selector:
        description: Compatibility subset to run
        required: true
        default: all
        type: choice
        options:
          - all
          - language
          - server
          - installation-family
      value:
        description: Language, server, or installation-family ID; empty for all
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Discover compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.matrix.outputs.plan }}
    steps:
      - name: Check out repository and data
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build matrix from current Mason registry
        id: matrix
        env:
          E2E_GITHUB_TOKEN: ${{ github.token }}
          E2E_SELECTOR: ${{ github.event.inputs.selector || 'all' }}
          E2E_SELECTOR_VALUE: ${{ github.event.inputs.value }}
          E2E_PLAN_OUTPUT: ${{ runner.temp }}/e2e-plan.json
          E2E_REPORT_OUTPUT: ${{ runner.temp }}/e2e-report.md
          E2E_REGISTRY_SNAPSHOT_OUTPUT: ${{ runner.temp }}/mason-registry
        run: |
          cargo run --locked --features e2e-workflow-planner --bin e2e-workflow-plan
          echo "plan=$(<"$E2E_PLAN_OUTPUT")" >> "$GITHUB_OUTPUT"
          cat "$E2E_REPORT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Mason registry snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mason-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mason-registry
          if-no-files-found: error
          retention-days: 1

  test:
    name: ${{ matrix.name }}
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.plan).has_runnable }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.plan).matrix }}
    steps:
      - name: Check out repository and data
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Download Mason registry snapshot
        uses: actions/download-artifact@v8
        with:
          name: mason-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mason-registry
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Cache E2E runtimes
        uses: actions/cache@v6
        with:
          path: .env
          key: e2e-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e/dependencies/catalog.rs') }}
          restore-keys: e2e-runtimes-${{ runner.os }}-${{ runner.arch }}-
      - name: Run real-server smoke cases
        env:
          E2E_CASES: ${{ matrix.cases }}
          E2E_RUNTIME_PROGRAMS: ${{ matrix.runtime_programs }}
          E2E_MASON_REGISTRY_SNAPSHOT: ${{ runner.temp }}/mason-registry
          E2E_RESULTS_OUTPUT: ${{ runner.temp }}/e2e-results.json
          E2E_RESULTS_SUMMARY_OUTPUT: ${{ runner.temp }}/e2e-results.md
        run: make test-real-server-smoke-e2e
      - name: Publish E2E result summary
        if: ${{ always() }}
        env:
          E2E_RESULTS_SUMMARY_OUTPUT: ${{ runner.temp }}/e2e-results.md
        run: |
          if [[ -f "$E2E_RESULTS_SUMMARY_OUTPUT" ]]; then
            cat "$E2E_RESULTS_SUMMARY_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## E2E shard results' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'No case results were produced; inspect the job log for a harness or build failure.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload E2E results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-${{ matrix.language }}-${{ matrix.installation_family }}
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: warn
          retention-days: 14
