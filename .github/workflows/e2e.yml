name: End-to-end compatibility

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      selector:
        description: Compatibility subset to run
        required: true
        default: all
        type: choice
        options:
          - all
          - language
          - server
          - installation-family
      value:
        description: Language, server, or installation-family ID; empty for all
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Discover compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.matrix.outputs.plan }}
    steps:
      - name: Check out repository and data
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build matrix from current Mason registry
        id: matrix
        env:
          E2E_GITHUB_TOKEN: ${{ github.token }}
          E2E_SELECTOR: ${{ github.event.inputs.selector || 'all' }}
          E2E_SELECTOR_VALUE: ${{ github.event.inputs.value }}
          E2E_PLAN_OUTPUT: ${{ runner.temp }}/e2e-plan.json
          E2E_REPORT_OUTPUT: ${{ runner.temp }}/e2e-report.md
          E2E_REGISTRY_SNAPSHOT_OUTPUT: ${{ runner.temp }}/mason-registry
        run: |
          cargo run --locked -p lsp-cli-e2e-support --features e2e-workflow-planner --bin e2e-workflow-plan
          echo "plan=$(<"$E2E_PLAN_OUTPUT")" >> "$GITHUB_OUTPUT"
          cat "$E2E_REPORT_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Mason registry snapshot
        uses: actions/upload-artifact@v7
        with:
          name: mason-registry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mason-registry
          if-no-files-found: error
          retention-days: 1

  # Run families in sequence to retain the global limit of four test jobs.
  # Explicit status checks let later families run after failures or empty selections.
  test-cargo:
    name: cargo
    needs:
      - plan
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.cargo.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.cargo.matrix) }}

  test-generic:
    name: generic
    needs:
      - plan
      - test-cargo
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.generic.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.generic.matrix) }}

  test-github:
    name: github
    needs:
      - plan
      - test-generic
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.github.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.github.matrix) }}

  test-golang:
    name: golang
    needs:
      - plan
      - test-github
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.golang.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.golang.matrix) }}

  test-luarocks:
    name: luarocks
    needs:
      - plan
      - test-golang
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.luarocks.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.luarocks.matrix) }}

  test-npm:
    name: npm
    needs:
      - plan
      - test-luarocks
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.npm.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.npm.matrix) }}

  test-nuget:
    name: nuget
    needs:
      - plan
      - test-npm
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.nuget.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.nuget.matrix) }}

  test-pypi:
    name: pypi
    needs:
      - plan
      - test-nuget
    if: ${{ !cancelled() && needs.plan.result == 'success' && fromJSON(needs.plan.outputs.plan).families.pypi.has_runnable }}
    uses: ./.github/workflows/e2e-family.yml
    with:
      matrix: ${{ toJSON(fromJSON(needs.plan.outputs.plan).families.pypi.matrix) }}
