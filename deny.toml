[advisories]
ignore = [
  { id = "RUSTSEC-2026-0542", reason = "Informational maintenance advisory. The locked humantime has no chrono dependency and only formats system log timestamps." },
]

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
  "BSD-3-Clause",
  "ISC",
]
