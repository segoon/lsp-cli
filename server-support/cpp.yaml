language:
  id: cpp
  kind: source
  project: playground/cpp
  query-profile:
    symbol-query: Order
    callable-query: format_order
    command-queries:
      implementation: OrderFormatting
    format-file: src/main.cpp
    expected-names:
      - Order
      - OrderItem
      - format_order
pairs:
  - language: cpp
    server: clangd
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - declaration
        - implementation
        - type-definition
        - build-index
      lsp-timeout-seconds: 15
      deadline-seconds: 240
