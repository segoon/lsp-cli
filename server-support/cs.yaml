language:
  id: cs
  kind: source
  project: playground/csharp
  query-profile:
    symbol-query: Order
    callable-query: BuildSampleOrder
    format-file: Program.cs
    expected-names:
      - Order
      - OrderItem
      - OrderService
      - BuildSampleOrder
pairs:
  - language: cs
    server: omnisharp
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - build-index
      lsp-timeout-seconds: 60
      deadline-seconds: 400
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      lsp-timeout-seconds: 15
  - language: cs
    server: roslyn_ls
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - implementation
        - type-definition
        - build-index
      exceptions:
        - command: grep
          outcome: empty-matches
          reason: Roslyn returns no workspace-symbol matches after document priming and retries
        - command: references
          outcome: empty-matches
          reason: Roslyn returns no references for the decorated BuildSampleOrder() method target
        - command: callers
          outcome: empty-matches
          reason: Roslyn returns no incoming call-hierarchy edges for BuildSampleOrder()
        - command: callees
          outcome: empty-matches
          reason: Roslyn returns no outgoing call-hierarchy edges for BuildSampleOrder()
        - command: type-definition
          outcome: empty-matches
          reason: BuildSampleOrder() is a method and has no applicable type-definition relationship
      callable-query: BuildSampleOrder()
      expected-names:
        - Playground.Models.Order
        - Playground.Models.OrderItem
        - Playground.Services.OrderService
        - BuildSampleOrder()
      lsp-timeout-seconds: 60
      deadline-seconds: 600
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      lsp-timeout-seconds: 15
  - language: cs
    server: ast_grep
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: cs
    server: harper_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: cs
    server: snyk_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
