language:
  id: go
  kind: source
  project: playground/go
  query-profile:
    symbol-query: Order
    callable-query: SampleOrder
    format-file: cmd/playground/main.go
    expected-names:
      - Order
      - Item
      - SampleOrder
      - Format
pairs:
  - language: go
    server: gopls
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - implementation
        - type-definition
        - build-index
      exceptions:
        - command: implementation
          outcome: failure
          message: is a function, not a method
          reason: gopls only resolves implementations for methods or interface types
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      deadline-seconds: 300
  - language: go
    server: ast_grep
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: go
    server: codebook
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: go
    server: harper_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: go
    server: snyk_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
