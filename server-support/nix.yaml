language:
  id: nix
  kind: metadata
  project: playground/nix
pairs:
  - language: nix
    server: nil_ls
    smoke:
      status: excluded
      reason: The pinned nil 2025-06-13 build script needs the host nix executable, which the E2E lane does not provision.
  - language: nix
    server: rnix
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - definition
  - language: nix
    server: ast_grep
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: nix
    server: harper_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
