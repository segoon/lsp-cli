language:
  id: nix
  kind: metadata
  project: playground/nix
pairs:
  - language: nix
    server: nil_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - references
        - definition
  - language: nix
    server: rnix
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - definition
  - language: nix
    server: ast_grep
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: nix
    server: harper_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
