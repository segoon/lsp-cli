language:
  id: objc
  kind: source
  project: playground/objc
  query-profile:
    symbol-query: Order
    callable-query: format_order
    command-queries:
      implementation: orderTotalValue
      type-definition: order
    format-file: src/main.m
    expected-names:
      - Order
      - format_order
pairs:
  - language: objc
    server: clangd
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - declaration
        - implementation
        - type-definition
        - build-index
      lsp-timeout-seconds: 15
      deadline-seconds: 240
  - language: objc
    server: snyk_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
