language:
  id: proto
  kind: metadata
  project: playground/proto
pairs:
  - language: proto
    server: buf_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
        - type-definition
  - language: proto
    server: pbls
    smoke:
      status: excluded
      reason: pkg:cargo/pbls@1.0.1?repository_url=https://git.sr.ht/~rrc/pbls requires its repository_url qualifier; crates.io has no matching pbls release.
  - language: proto
    server: protols
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
