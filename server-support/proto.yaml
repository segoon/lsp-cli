language:
  id: proto
  kind: metadata
  project: playground/proto
pairs:
  - language: proto
    server: buf_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
        - type-definition
  - language: proto
    server: pbls
    smoke:
      status: excluded
      reason: Cargo recipe provisioning is covered separately; initialization and semantic queries have not yet been validated for this server.
  - language: proto
    server: protols
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
