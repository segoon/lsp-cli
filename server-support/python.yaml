language:
  id: python
  kind: source
  project: playground/python
  query-profile:
    symbol-query: Order
    callable-query: build_sample_order
    command-queries:
      implementation: OrderFormatting
      type-definition: order
    format-file: main.py
    expected-names:
      - Order
      - OrderItem
      - build_sample_order
      - format_order
pairs:
  - language: python
    server: basedpyright
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - declaration
        - implementation
        - type-definition
        - build-index
  - language: python
    server: jedi_language_server
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
        - declaration
        - type-definition
        - build-index
  - language: python
    server: pylsp
    smoke:
      status: excluded
      reason: python-lsp-server does not advertise workspace/symbol, which the shared source-language query suite requires to locate declarations.
  - language: python
    server: pylyzer
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - implementation
        - type-definition
        - build-index
      exceptions:
        - command: callers
          outcome: empty-matches
          reason: pylyzer returns no incoming call-hierarchy edges for the fixture function
  - language: python
    server: pyre
    smoke:
      status: excluded
      reason: Pyre persistent initializes with the fixture configuration but advertises only document synchronization, not the semantic capabilities required by the shared query suite.
  - language: python
    server: pyrefly
    smoke:
      status: excluded
      reason: Current Pyrefly initializes but returns no workspace or document symbols for the Python fixture.
  - language: python
    server: pyright
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - declaration
        - type-definition
        - build-index
      lsp-timeout-seconds: 20
      deadline-seconds: 240
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      lsp-timeout-seconds: 20
  - language: python
    server: ty
    smoke:
      status: excluded
      reason: Current ty returns inconsistent call-hierarchy results across clean isolated runs.
  - language: python
    server: zuban
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
        - declaration
        - implementation
        - type-definition
        - build-index
  - language: python
    server: ast_grep
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: python
    server: codebook
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: python
    server: dprint
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
  - language: python
    server: efm
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: python
    server: harper_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
