language:
  id: rust
  kind: source
  project: playground/rust
  query-profile:
    symbol-query: Order
    callable-query: sample_order
    command-queries:
      implementation: OrderTotaling
      type-definition: SAMPLE_ORDER_VALUE
    format-file: src/main.rs
    expected-names:
      - Order
      - OrderItem
      - sample_order
      - format_order
pairs:
  - language: rust
    server: rust_analyzer
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - declaration
        - implementation
        - type-definition
        - build-index
      exceptions:
        - command: type-definition
          outcome: empty-matches
          reason: rust-analyzer returns no type definition for the explicitly typed top-level SAMPLE_ORDER_VALUE static
      deadline-seconds: 180
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
