language:
  id: scss
  kind: metadata
  project: playground/scss
pairs:
  - language: scss
    server: css_variables
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - definition
  - language: scss
    server: cssls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - list-symbols
        - list-functions
        - references
        - definition
  - language: scss
    server: somesass_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
  - language: scss
    server: emmet_language_server
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: scss
    server: emmet_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: scss
    server: stylelint_lsp
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: scss
    server: tailwindcss
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: scss
    server: unocss
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: scss
    server: wc_language_server
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - references
        - definition
