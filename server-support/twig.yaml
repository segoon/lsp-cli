language:
  id: twig
  kind: metadata
  project: playground/twig
pairs:
  - language: twig
    server: twiggy_language_server
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - references
        - definition
  - language: twig
    server: htmx
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: twig
    server: tailwindcss
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
