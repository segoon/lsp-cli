language:
  id: vue
  kind: metadata
  project: playground/vue
pairs:
  - language: vue
    server: vtsls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - callers
        - callees
        - definition
        - implementation
        - type-definition
  - language: vue
    server: vue_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - references
        - definition
  - language: vue
    server: emmet_language_server
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: vue
    server: emmet_ls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: vue
    server: eslint
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: vue
    server: htmx
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: vue
    server: stylelint_lsp
    smoke:
      status: excluded
      reason: Capability discovery could not obtain a valid initialize response.
  - language: vue
    server: tailwindcss
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: vue
    server: unocss
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
  - language: vue
    server: wc_language_server
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - references
        - definition
