language:
  id: yaml.helm-values
  kind: metadata
  project: playground/yaml.helm-values
pairs:
  - language: yaml.helm-values
    server: helm_ls
    smoke:
      status: excluded
      reason: pkg:github/mrjosh/helm-ls@v0.5.4 closes the transport while the client waits for the shutdown response.
  - language: yaml.helm-values
    server: yamlls
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
        - format
        - list-symbols
        - list-functions
        - definition
