    symbol-query: Order
    callable-query: sample_order
    format-file: main.zig
    expected-names:
      - Order
      - OrderItem
      - sample_order
      - format_order
pairs:
  - language: zig
    server: zls
    tier: smoke
    smoke:
      status: queries
      supported-operations:
        - server-capabilities
        - diagnostics
        - format
        - grep
        - list-symbols
        - list-functions
        - references
        - definition
        - declaration
        - type-definition
        - build-index
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
  - language: zig
    server: codebook
    smoke:
      status: capabilities
      supported-operations:
        - server-capabilities
