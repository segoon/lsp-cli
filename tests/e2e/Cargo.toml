[package]
name = "lsp-cli-e2e-support"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false
autotests = false

[features]
e2e-workflow-planner = ["dep:thiserror", "dep:zip"]
mock-tests = ["dep:flate2", "dep:tar"]

[[bin]]
name = "e2e-workflow-plan"
path = "planner/main.rs"
required-features = ["e2e-workflow-planner"]
test = false

[lib]
path = "lib.rs"

[dependencies]
command-group = "5.0.1"
flate2 = { version = "1.1.5", optional = true }
fs_extra = "1.3.0"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tar = { version = "0.4.46", optional = true }
tempfile = "3.23.0"
thiserror = { version = "2.0.17", optional = true }
wait-timeout = "0.2.1"
url = "2.5.7"
zip = { version = "8.6.0", default-features = false, features = ["deflate"], optional = true }
backon = { version = "1.6.0", default-features = false, features = ["std", "std-blocking-sleep"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.27.1", features = ["process", "signal"] }

[lints]
workspace = true
