language:
  id: clojure
  kind: source
  project: playground/clojure
  query-profile:
    symbol-query: Order
    callable-query: build-sample-order
    command-queries:
      implementation: OrderFormatting
      type-definition: formatter
    format-file: main.clj
    expected-names:
      - Order
      - OrderItem
      - build-sample-order
      - format-order
pairs:
  - language: clojure
    server: clojure_lsp
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: grep
          outcome: empty-matches
          reason: clojure-lsp returns no workspace/symbol matches for this fixture
        - command: declaration
          outcome: empty-matches
          reason: clojure-lsp returns no textDocument/declaration matches for this fixture
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: clojure-lsp exposes no background-work progress signal
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
