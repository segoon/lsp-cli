language:
  id: cuda
  kind: source
  project: playground/cuda
  query-profile:
    symbol-query: Order
    callable-query: format_order
    format-file: src/main.cu
    expected-names:
      - Order
      - OrderItem
      - format_order
pairs:
  - language: cuda
    server: clangd
    smoke:
      status: queries
      exceptions:
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: clangd exposes no background-work completion notification
      lsp-timeout-seconds: 15
      deadline-seconds: 240
