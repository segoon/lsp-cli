language:
  id: go
  kind: source
  project: playground/go
  query-profile:
    symbol-query: Order
    callable-query: SampleOrder
    format-file: cmd/playground/main.go
    expected-names:
      - Order
      - Item
      - SampleOrder
      - Format
pairs:
  - language: go
    server: gopls
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: implementation
          outcome: failure
          message: is a function, not a method
          reason: gopls only resolves implementations for methods or interface types
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      deadline-seconds: 300
