language:
  id: javascript
  kind: source
  project: playground/js
  query-profile:
    symbol-query: Order
    callable-query: buildSampleOrder
    format-file: src/index.js
    expected-names:
      - Order
      - OrderItem
      - buildSampleOrder
      - formatOrder
pairs:
  - language: javascript
    server: denols
    smoke:
      status: excluded
      reason: Deno LSP rejects the standard shutdown request because it requires non-null parameters.
  - language: javascript
    server: ts_ls
    smoke:
      status: queries
      exceptions:
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: typescript-language-server exposes no background-work progress signal
      lsp-timeout-seconds: 20
      deadline-seconds: 240
  - language: javascript
    server: vtsls
    smoke:
      status: queries
      exceptions:
        - command: grep
          outcome: empty-matches
          reason: vtsls returns no workspace symbols before project analysis completes
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: vtsls exposes no background-work completion notification
