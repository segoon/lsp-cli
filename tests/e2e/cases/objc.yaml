language:
  id: objc
  kind: source
  project: playground/objc
  query-profile:
    symbol-query: Order
    callable-query: format_order
    format-file: src/main.m
    expected-names:
      - Order
      - format_order
pairs:
  - language: objc
    server: clangd
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: implementation
          outcome: empty-matches
          reason: the Objective-C fixture callable has no implementation relationship
        - command: type-definition
          outcome: empty-matches
          reason: the Objective-C fixture callable is not a value with a distinct type definition
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: clangd exposes no background-work completion notification
      lsp-timeout-seconds: 15
      deadline-seconds: 240
