language:
  id: objc
  kind: source
  project: playground/objc

pairs:
  - language: objc
    server: clangd
    setup:
      provision: { method: download }
    smoke:
      status: queries
      symbol-query: Order
      callable-query: format_order
      format-file: src/main.m
      expected-names: [Order, format_order]
      exceptions:
        - { command: grep, outcome: empty-matches, reason: "clangd may not publish workspace symbols before background indexing completes" }
        - { command: build-index, outcome: failure, message: "background-work progress", reason: "clangd exposes no background-work completion notification" }
      lsp-timeout-seconds: 15
      deadline-seconds: 240
