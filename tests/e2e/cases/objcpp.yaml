language:
  id: objcpp
  kind: source
  project: playground/objcpp
  query-profile:
    symbol-query: Order
    callable-query: format_order
    format-file: src/main.mm
    expected-names:
      - Order
      - format_order
pairs:
  - language: objcpp
    server: clangd
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: implementation
          outcome: empty-matches
          reason: the Objective-C++ fixture callable has no implementation relationship
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: clangd exposes no background-work completion notification
      lsp-timeout-seconds: 15
      deadline-seconds: 240
