language:
  id: python
  kind: source
  project: playground/python
  query-profile:
    symbol-query: Order
    callable-query: build_sample_order
    format-file: main.py
    expected-names:
      - Order
      - OrderItem
      - build_sample_order
      - format_order
pairs:
  - language: python
    server: basedpyright
    smoke:
      status: queries
      exceptions:
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: BasedPyright exposes no background-work progress signal
  - language: python
    server: jedi_language_server
    smoke:
      status: excluded
      reason: Jedi Language Server answers queries but does not exit reliably after the standard shutdown exchange.
  - language: python
    server: pylsp
    smoke:
      status: excluded
      reason: python-lsp-server does not advertise workspace/symbol, which the shared source-language query suite requires to locate declarations.
  - language: python
    server: pylyzer
    smoke:
      status: queries
      exceptions:
        - command: callers
          outcome: empty-matches
          reason: pylyzer returns no incoming call-hierarchy edges for the fixture function
  - language: python
    server: pyre
    smoke:
      status: excluded
      reason: Pyre persistent initializes with the fixture configuration but advertises only document synchronization, not the semantic capabilities required by the shared query suite.
  - language: python
    server: pyrefly
    smoke:
      status: excluded
      reason: Current Pyrefly initializes but returns no workspace or document symbols for the Python fixture.
  - language: python
    server: pyright
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: pyright exposes no background-work progress signal
      lsp-timeout-seconds: 20
      deadline-seconds: 240
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
      lsp-timeout-seconds: 20
  - language: python
    server: ty
    smoke:
      status: excluded
      reason: Current ty returns inconsistent call-hierarchy results across clean isolated runs.
  - language: python
    server: zuban
    smoke:
      status: queries
      exceptions:
        - command: build-index
          outcome: failure
          message: background-work progress
          reason: Zuban exposes no background-work progress signal
