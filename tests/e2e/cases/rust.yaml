language:
  id: rust
  kind: source
  project: playground/rust
  query-profile:
    symbol-query: Order
    callable-query: sample_order
    format-file: src/main.rs
    expected-names:
      - Order
      - OrderItem
      - sample_order
      - format_order
pairs:
  - language: rust
    server: rust_analyzer
    tier: smoke
    smoke:
      status: queries
      exceptions:
        - command: implementation
          outcome: empty-matches
          reason: the Rust fixture callable has no implementation relationship
        - command: type-definition
          outcome: empty-matches
          reason: the Rust fixture callable is not a value with a distinct type definition
      deadline-seconds: 180
    lifecycle:
      status: scenarios
      direct-run:
        status: exchange
