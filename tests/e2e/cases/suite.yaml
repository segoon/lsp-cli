    reason: pkg:github/PMunch/nimlsp@v0.4.7 has no Mason asset matching the Linux x86-64 E2E platform.
  - case: provisioning/pbls
    reason: pkg:cargo/pbls@1.0.1?repository_url=https://git.sr.ht/~rrc/pbls requires its repository_url qualifier; crates.io has no matching pbls release.
  - case: provisioning/phpactor
    reason: pkg:github/phpactor/phpactor@2026.07.22.0 does not produce a runnable phpactor at the Mason-configured path.
  - case: provisioning/pico8_ls
    reason: pkg:github/japhib/pico8-ls@40c53c2061a42b20b22f83467d241e668c2487a2 has no Mason asset matching the Linux x86-64 E2E platform.
  - case: provisioning/powershell_es
    reason: pkg:github/PowerShell/PowerShellEditorServices@v4.7.0 requires pwsh, but the Mason recipe does not expose that executable.
  - case: provisioning/puppet
    reason: pkg:github/puppetlabs/puppet-editor-services@v2.0.4 does not produce a runnable puppet-languageserver at the Mason-configured path.
  - case: provisioning/r_language_server
    reason: pkg:github/mason-org/r-languageserver@v0.3.17 has no Mason asset matching the Linux x86-64 E2E platform.
  - case: provisioning/raku_navigator
    reason: pkg:github/bscan/RakuNavigator@ccd511dbd156f396eed613f21adbcd8e38a8c784 installs a launcher that resolves managed node outside the isolated E2E home.
  - case: provisioning/salt_ls
    reason: pkg:pypi/salt-lsp@0.0.1 fails during virtual-environment installation, and the current error reporting retains only pip's generic subprocess note.
  - case: provisioning/smithy_ls
    reason: pkg:github/awslabs/smithy-language-server@0.9.0 requires coursier, but the Mason recipe does not expose that executable.
  - case: provisioning/sqls
    reason: pkg:golang/github.com/sqls-server/sqls@v0.2.48 is paired with the literal placeholder command path/to/command in the bundled LSP config.
  - case: provisioning/vala_ls
    reason: pkg:github/vala-lang/vala-language-server@8fab39f867a15dc3f1d24bc0ae455f6e019230bd has no Mason asset matching the Linux x86-64 E2E platform.
  - case: provisioning/vespa_ls
    reason: pkg:github/vespa-engine/vespa@lsp-v2.6.0 installs a launcher that resolves managed java outside the isolated E2E home.
  - case: provisioning/vhdl_ls
    reason: pkg:github/vhdl-ls/rust_hdl@v0.88.0 leaves the Mason template {{source.asset.libraries}} unresolved while installing supporting files.
  - case: provisioning/visualforce_ls
    reason: pkg:github/forcedotcom/salesforcedx-vscode@v67.20.0 installs a launcher that resolves managed node outside the isolated E2E home.
  - case: provisioning/vls
    reason: pkg:github/vlang/vls@latest requires v, but the Mason recipe does not expose that executable.
  - case: smoke/python/pylyzer
    reason: pkg:github/mtshiba/pylyzer@v0.0.82 returns no textDocument/typeDefinition match for an order parameter explicitly typed as Order after three bounded attempts; server stderr also reports missing ERG_PATH with diagnostics-worker panics.

