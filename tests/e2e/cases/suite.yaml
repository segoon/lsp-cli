  - id: wc_language_server
    owner-language: typescript
    provisioning: { status: excluded, reason: "wc-language-server is Web-Components-specific rather than a general-purpose TypeScript server." }
  - id: zuban
    owner-language: python
    provisioning:
      status: download
      host-programs: [{ name: python3, resolve: [which, python3] }]
      deadline-seconds: 600

